name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build NudgeClock.exe
        shell: cmd
        run: src\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: NudgeClock
          path: NudgeClock.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NudgeClock

      - uses: softprops/action-gh-release@v2
        with:
          files: NudgeClock.exe
          generate_release_notes: true
